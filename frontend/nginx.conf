# Nginx konfiguration til frontend-containeren
server {

    # Lyt på HTTP port 80
    listen 80;

    # Accepter requests til alle hostnames/domæner
    server_name _;

    # Mappen hvor de byggede Vite-filer ligger
    root /usr/share/nginx/html;

    # Standardfil der serveres ved requests til roden
    index index.html;

    # --------------------------------------------------
    # Frontend (React SPA)
    # --------------------------------------------------

    # Forsøg først at finde den ønskede fil eller mappe.
    # Hvis den ikke findes, returneres index.html.
    #
    # Dette er nødvendigt for React Router og andre
    # client-side routing løsninger, så URL'er som:
    #   /login
    #   /dashboard
    #   /profile/123
    # fungerer korrekt ved direkte opslag eller refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------
    # Backend API Proxy
    # --------------------------------------------------

    # Alle requests der starter med /api/
    # videresendes til backend-containeren.
    #
    # Docker DNS sørger for, at hostname "backend" ,
    # automatisk peger på backend-servicen/containeren.
    location /api/ {

        # Forward requesten til backend-applikationen
        proxy_pass http://backend:5000/api/;

        # Brug HTTP/1.1 til proxied requests
        proxy_http_version 1.1;

        # Bevar originale request-oplysninger,
        # så backenden kan se klientens IP, host osv.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
