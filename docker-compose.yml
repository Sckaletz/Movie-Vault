services:
  # 1. Database — Postgres running on our own server
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend API — starts once the database is healthy
  backend:
    build: ./backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      # Connect to the local "db" service (no SSL for local Postgres)
      DATABASE_URL: ${DATABASE_URL}
      TMDB_API_KEY: ${TMDB_API_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  # 3. Frontend — built with Vite and served by Nginx (also proxies /api)
  frontend:
    build:
      context: ./frontend
      args:
        # The app calls /api, which Nginx proxies to the backend container
        VITE_API_URL: /api
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    restart: always
    expose:
      - "80"
    depends_on:
      - backend

volumes:
  postgres_data:
