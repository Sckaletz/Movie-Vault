services:
  backend:
    build: ./backend
    container_name: movie-vault-backend
    # Bound to localhost only — the frontend reaches the backend over the
    # internal compose network (http://backend:5001), not via this host port.
    # Kept for local debugging on the server (curl 127.0.0.1:5001).
    ports:
      - "127.0.0.1:5001:5001"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: movie-vault-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: movie-vault-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
