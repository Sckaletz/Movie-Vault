version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: movie-vault-db
    environment:
    env_file:
      - ./.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
  
  backend:
    build: ./backend
    container_name: movie-vault-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: movie-vault-frontend
    ports:
      - "80:80"
    env_file:
      - ./frontend/.env
    restart: unless-stopped

volumes:
  pgdata: