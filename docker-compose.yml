services:
  backend:
    build: ./backend
    container_name: movie-vault-backend
    init: true
    env_file:
      - ./backend/.env
    expose:
      - "5001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: movie-vault-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - edge
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: movie-vault-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

networks:
  edge:
  backend:
    internal: true
    
volumes:
  pgdata: